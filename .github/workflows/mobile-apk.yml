name: mobile console APK

# Build the Flutter mobile console and publish the per-ABI release APKs to the
# Gitea generic package registry:
#
#   <server>/<owner>/-/packages/generic/roundpen-console/<version>/
#
# Install on a phone with:  adb install -r app-arm64-v8a-release.apk
#
# Notes for whoever maintains this:
#   * Release builds are signed with the Android debug keystore (the Flutter
#     template does that). Fine for sideloading onto your own device; a store
#     or a wider rollout needs a real keystore via key.properties.
#   * A plugin brings native code, so AGP insists on the NDK version Flutter
#     pins — the job installs it explicitly instead of letting AGP download it
#     mid-build.
#   * Egress on this intranet: the internet is only reachable through the
#     SOCKS5 proxy 10.10.1.4:1212. Direct connects stall on anything larger
#     than a few hundred KB (a GitHub clone dies with "unexpected EOF"), which
#     is why the runner daemon fetches actions through `ci-proxy`, an HTTP
#     CONNECT front for that SOCKS5 proxy running on the runner host
#     (10.10.1.5:18118, source in /opt/ci-proxy). The job uses the same bridge
#     for the tools that cannot speak SOCKS5 — the node-based actions, curl,
#     git and Dart/pub. Java ignores the *_PROXY variables, so
#     JAVA_TOOL_OPTIONS points Gradle, sdkmanager and the Gradle wrapper at
#     the SOCKS5 proxy directly.
#   * NO_PROXY must keep intranet traffic (Gitea, the runner's cache server)
#     off the proxy: the SOCKS5 proxy cannot route back into 10.0.0.0/8.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Package version to publish (default: short SHA)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  FLUTTER_VERSION: "3.47.5"
  ANDROID_PLATFORM: "android-36"
  ANDROID_BUILD_TOOLS: "36.0.0"
  ANDROID_NDK: "28.2.13676358"
  PACKAGE_NAME: "roundpen-console"

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # See the egress note above. Read by the node actions, curl, git and
      # Dart/pub; the JVM is covered by JAVA_TOOL_OPTIONS instead.
      HTTP_PROXY: "http://10.10.1.5:18118"
      HTTPS_PROXY: "http://10.10.1.5:18118"
      NO_PROXY: "localhost,127.0.0.1,::1,git.eaxi.com,10.10.1.5"
      JAVA_TOOL_OPTIONS: "-DsocksProxyHost=10.10.1.4 -DsocksProxyPort=1212"
    steps:
      - uses: actions/checkout@v4

      - name: Compute the package version
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            version="${{ inputs.version }}"
          else
            version="sha-${GITHUB_SHA::7}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: android-actions/setup-android@v3

      - name: Install the SDK components the build needs
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;${ANDROID_PLATFORM}" \
                     "build-tools;${ANDROID_BUILD_TOOLS}" "ndk;${ANDROID_NDK}"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-v1

      - name: Build the release APKs
        working-directory: mobile
        run: |
          flutter pub get
          # One APK per ABI: arm64 phones, older armv7 phones, and x86_64 for
          # emulators / android-in-containers (redroid).
          flutter build apk --release --split-per-abi

      - name: Publish to the package registry
        working-directory: mobile/build/app/outputs/flutter-apk
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"

          server="${SERVER_URL:-}"
          if [[ -z "${server}" ]]; then
            host="$(git config --get remote.origin.url | sed -E 's#^(ssh://)?([^@/]*@)?([^:/]+)[:/].*#\3#')"
            server="https://${host}"
          fi
          base="${server}/api/packages/${OWNER}/generic/${PACKAGE_NAME}/${version}"

          sha256sum ./*.apk > sha256sums.txt
          for file in ./*.apk sha256sums.txt; do
            echo "→ ${base}/${file}"
            curl -fsS -X PUT \
              -H "Authorization: token ${TOKEN}" \
              --upload-file "${file}" \
              "${base}/${file}"
          done
          echo "Published ${PACKAGE_NAME} ${version}: ${base}"
