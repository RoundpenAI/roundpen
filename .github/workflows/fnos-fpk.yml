name: fnOS fpk

# Publish the roundpend image, then package it for 飞牛 fnOS in both
# architectures and attach the .fpk files to the release of the pushed tag
# (Gitea or github.com; the mobile workflow publishes the same way):
#
#   ghcr.io/<owner>/roundpend:<version>          (amd64 + arm64 manifest)
#   dist/fnos/roundpen-<version>-fnos-x86.fpk    (+ .sha256)
#   dist/fnos/roundpen-<version>-fnos-arm.fpk    (+ .sha256)
#
# Install on a NAS with: appcenter-cli install-fpk roundpen-<version>-fnos-x86.fpk
#
# The packages pull the image at install time; dispatch with with_image=1 to
# also bundle it as app/images/roundpend.tar (offline installs).
# fnpack comes from static2.fnnas.com (external; the runner's proxy env applies)
# and is pinned by SHA-256.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Package version to build (default: tag without v, else 0.1.0)"
        required: false
        type: string
      with_image:
        description: "Bundle the image tar for offline installs (1 = yes, 0 = NAS pulls)"
        required: false
        default: "0"
        type: string

permissions:
  contents: write
  packages: write

env:
  FNPACK_VERSION: "1.2.3"
  FNPACK_SHA256_LINUX_AMD64: "54b97fa7b70968c4d05c79840f5daeff508957d0bb2062fdb0376d00d9615c93"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve version
        id: resolve
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_VERSION}" ]]; then
            version="${INPUT_VERSION}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.1.0"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "building ${version}"

  image:
    name: Publish the roundpend image
    needs: version
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.tags.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Compute image reference
        id: tags
        run: |
          set -euo pipefail
          owner_lc="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner_lc}/roundpend" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One multi-arch manifest: x86 NAS pulls amd64, arm NAS pulls arm64.
      # Behind a slow link the runner can pass mirrors through the Dockerfile's
      # NPM_REGISTRY / GOPROXY / PLAYWRIGHT_NPM_REGISTRY build args.
      - name: Build and push
        env:
          VERSION: ${{ needs.version.outputs.version }}
          IMAGE: ${{ steps.tags.outputs.image }}
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --push \
            -t "${IMAGE}:${VERSION}" \
            -t "${IMAGE}:latest" \
            -f deploy/Dockerfile .

  build:
    name: Build .fpk (${{ matrix.platform }})
    needs: [version, image]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x86
          - platform: arm
    steps:
      - uses: actions/checkout@v4

      # Only the offline (with_image=1) arm package needs emulation.
      - if: matrix.platform == 'arm' && github.event.inputs.with_image == '1'
        uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Install fnpack
        run: |
          set -euo pipefail
          curl -fsSLo /usr/local/bin/fnpack \
            "https://static2.fnnas.com/fnpack/fnpack-${FNPACK_VERSION}-linux-amd64"
          echo "${FNPACK_SHA256_LINUX_AMD64}  /usr/local/bin/fnpack" | sha256sum -c -
          chmod +x /usr/local/bin/fnpack
          fnpack --help > /dev/null

      - name: Build package
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          WITH_IMAGE: ${{ github.event.inputs.with_image || '0' }}
        run: ./scripts/build-fnos-fpk.sh

      - uses: actions/upload-artifact@v4
        with:
          name: fpk-${{ matrix.platform }}
          path: dist/fnos/*.fpk*

  release:
    name: Attach packages to the release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/fnos
          merge-multiple: true

      - name: Publish the fpk files
        working-directory: dist/fnos
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          server="${SERVER_URL:-}"
          if [[ -z "${server}" ]]; then
            host="$(git config --get remote.origin.url | sed -E 's#^(ssh://)?([^@/]*@)?([^:/]+)[:/].*#\3#')"
            server="https://${host}"
          fi
          # Gitea (self-hosted) and GitHub differ in the API base, the auth
          # scheme and the asset upload host. (github.com serves its API from
          # api.github.com; /api/v3 is GitHub Enterprise Server's prefix.)
          if [[ "${server}" == *"github.com"* ]]; then
            api="https://api.github.com/repos/${REPO}"
            upload_api="https://uploads.github.com/repos/${REPO}/releases"
            auth="Authorization: Bearer ${TOKEN}"
          else
            api="${server}/api/v1/repos/${REPO}"
            upload_api="${api}/releases"
            auth="Authorization: token ${TOKEN}"
          fi
          # The tag that triggered the run, normalised to v<version>.
          tag="v${TAG#v}"

          # Re-running the same version reuses the release from the first try.
          release_id="$(curl -fsS -H "${auth}" "${api}/releases/tags/${tag}" 2>/dev/null |
            jq -r 'first(.id)' || true)"
          if [[ -z "${release_id}" || "${release_id}" == "null" ]]; then
            payload="$(jq -n --arg tag "${tag}" --arg sha "${GITHUB_SHA}" \
                '{tag_name: $tag, name: $tag, target_commitish: $sha}')"
            # Keep the API's reply on failure: a bare `curl -f` hides which
            # permission or policy the token is missing.
            reply="$(curl -sS -X POST -H "${auth}" -H "Content-Type: application/json" \
                --data-binary "${payload}" -w $'\n%{http_code}' "${api}/releases")" || true
            code="${reply##*$'\n'}"
            if [[ "${code}" != 2?? ]]; then
              echo "creating the ${tag} release failed: HTTP ${code}" >&2
              echo "${reply%$'\n'*}" >&2
              exit 1
            fi
            release_id="$(jq -r '.id' <<<"${reply%$'\n'*}")"
          fi
          echo "release ${tag}: id=${release_id}"
          # Deleting an asset hangs off /releases/assets on github.com but off
          # /releases/<id>/assets on Gitea.
          if [[ "${server}" == *"github.com"* ]]; then
            assets_api="${api}/releases/assets"
          else
            assets_api="${api}/releases/${release_id}/assets"
          fi

          sha256sum ./*.fpk > sha256sums-fnos.txt
          for file in ./*.fpk ./*.fpk.sha256 ./sha256sums-fnos.txt; do
            name="${file#./}"
            # Drop an asset of the same name left by an earlier run, so that a
            # re-run replaces it instead of failing on the duplicate.
            asset_id="$(curl -fsS -H "${auth}" "${api}/releases/${release_id}/assets" |
              jq -r --arg n "${name}" 'first(.[] | select(.name == $n) | .id)' || true)"
            if [[ -n "${asset_id}" && "${asset_id}" != "null" ]]; then
              curl -fsS -X DELETE -H "${auth}" "${assets_api}/${asset_id}"
            fi
            echo "→ ${tag}/${name}"
            if [[ "${server}" == *"github.com"* ]]; then
              # GitHub takes the file as the raw request body.
              curl -sS --fail-with-body -X POST -H "${auth}" \
                -H "Content-Type: application/octet-stream" \
                --data-binary "@${file}" \
                "${upload_api}/${release_id}/assets?name=${name}"
            else
              # Gitea reads the file from a multipart form field.
              curl -fsS -X POST -H "${auth}" -F "attachment=@${file}" \
                "${upload_api}/${release_id}/assets?name=${name}"
            fi
            echo
          done
