# Roundpen private deploy (API + Postgres). UI is embedded in roundpend —
# no Node on the host.
#
#   cp .env.compose.example .env
#   docker compose up -d --build
#   open http://127.0.0.1:9527
#
# First boot logs print the admin password and API key once.

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: roundpen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-roundpen}
      POSTGRES_DB: roundpen
    volumes:
      - roundpen-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roundpen -d roundpen"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    # Do not publish Postgres on the host by default. For host-side tools:
    #   ports:
    #     - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  roundpend:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${ROUNDPEN_PORT:-9527}:9527"
    environment:
      ROUNDPEN_HTTP_ADDR: ":9527"
      DATABASE_URL: "postgres://roundpen:${POSTGRES_PASSWORD:-roundpen}@postgres:5432/roundpen?sslmode=disable"
      ROUNDPEN_BACKEND: "${ROUNDPEN_BACKEND:-kern}"
      ROUNDPEN_DEFAULT_IMAGE: "${ROUNDPEN_DEFAULT_IMAGE:-host}"
      ROUNDPEN_DATA_ROOT: /data
      ROUNDPEN_BOOTSTRAP_ADMIN: "true"
      ROUNDPEN_PREVIEW_PUBLIC_URL: "${ROUNDPEN_PREVIEW_PUBLIC_URL:-http://127.0.0.1:9527}"
      # Optional: set to a stable key so restarts don't rotate admin API key.
      # ROUNDPEN_API_KEY: "${ROUNDPEN_API_KEY:-}"
    volumes:
      - roundpen-data:/data
    # For Docker-backed sandboxes on the host engine, uncomment:
    #   ROUNDPEN_BACKEND=docker
    #   ROUNDPEN_DEFAULT_IMAGE=alpine:3.20
    # and:
    #   volumes:
    #     - roundpen-data:/data
    #     - /var/run/docker.sock:/var/run/docker.sock
    #   user: root   # needed to talk to the socket
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9527/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  roundpen-pgdata:
  roundpen-data:
