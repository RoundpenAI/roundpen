# Roundpen on fnOS. appcenter starts and stops this project with the app
# (config/resource declares it as a docker-project), so cmd/main never runs
# compose itself. TRIM_* come from the platform; ROUNDPEN_* can be overridden
# from the app's environment when the package is installed or updated.

services:
  postgres:
    image: ${DOCKER_MIRROR:-}docker.io/pgvector/pgvector:pg16
    container_name: roundpen-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: roundpen
      POSTGRES_DB: roundpen
      # No password on purpose: appcenter validates this project during install
      # (before lifecycle scripts run), so a credentials file generated by
      # cmd/install_callback cannot be relied on. The project network is private
      # and the port is never published, so only roundpend can reach the database.
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      # Named volume: the postgres entrypoint takes care of its ownership, and
      # a bind mount under @appdata would be owned by the package user.
      - roundpen-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roundpen -d roundpen"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  roundpend:
    # Published by .github/workflows/fnos-fpk.yml; offline packages bundle the
    # same tag as app/images/roundpend.tar (loaded by cmd/install_callback).
    image: ${ROUNDPEN_IMAGE:-ghcr.io/roundpenai/roundpend:0.1.0}
    container_name: roundpen
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${TRIM_SERVICE_PORT:-9527}:9527"
    environment:
      ROUNDPEN_HTTP_ADDR: ":9527"
      DATABASE_URL: "postgres://roundpen@postgres:5432/roundpen?sslmode=disable"
      ROUNDPEN_BACKEND: docker
      ROUNDPEN_AGENT_IMAGE: "${ROUNDPEN_AGENT_IMAGE:-ghcr.io/roundpenai/code-agent:0.1.0}"
      ROUNDPEN_DEFAULT_IMAGE: "${ROUNDPEN_DEFAULT_IMAGE:-ghcr.io/roundpenai/code-agent:0.1.0}"
      ROUNDPEN_DATA_ROOT: ${TRIM_PKGVAR:?}/data
      ROUNDPEN_BOOTSTRAP_ADMIN: "true"
      ROUNDPEN_IM_ENABLED: "true"
      # Preview links must be reachable from the user's browser: set the NAS
      # address in 系统管理 → 通用 (or override this default before install).
      ROUNDPEN_PREVIEW_PUBLIC_URL: "${ROUNDPEN_PREVIEW_PUBLIC_URL:-http://127.0.0.1:9527}"
      # Optional wildcard zone for per-port preview origins, e.g. rp.mk
      ROUNDPEN_PREVIEW_DOMAIN: "${ROUNDPEN_PREVIEW_DOMAIN:-}"
    volumes:
      # Same path inside and outside on purpose: roundpend hands the agent
      # workspace bind (${TRIM_PKGVAR}/data/sandboxes/<id>) to the host Docker
      # daemon, and a path that only exists inside this container would fail
      # with "bind source path does not exist".
      - ${TRIM_PKGVAR:?}/data:${TRIM_PKGVAR:?}/data
      # Agent and Browser containers run on the host Docker engine.
      - /var/run/docker.sock:/var/run/docker.sock
    # Needs the host Docker socket (root-owned) to create Agent containers.
    user: root
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9527/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  roundpen-pgdata:
