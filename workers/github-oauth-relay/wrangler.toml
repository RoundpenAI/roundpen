name = "roundpen"
main = "src/index.ts"
compatibility_date = "2026-10-18"

# Register this origin + /github/callback on the official GitHub App.
[[routes]]
pattern = "auth.eaxi.com"
custom_domain = true

[vars]
# Public origin of THIS worker. Must match the GitHub App callback origin.
PUBLIC_BASE = "https://auth.eaxi.com"
# Signed-in Roundpen users authorize this app so the agent can git/gh as them.
GITHUB_SCOPES = "repo read:user user:email"
TICKET_TTL_SECONDS = "60"

[[durable_objects.bindings]]
name = "TICKETS"
class_name = "TicketDO"

[[durable_objects.bindings]]
name = "INSTALLS"
class_name = "InstallDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TicketDO", "InstallDO"]
